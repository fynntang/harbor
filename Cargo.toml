[workspace]
members = ["crates/harbor-core", "crates/harbor-cli"]
resolver = "2"

[workspace.package]
version = "26.9.111926"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
harbor-core = { path = "./crates/harbor-core" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
plist = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.12"


[profile.release]
lto = "thin"
strip = true
codegen-units = 1
